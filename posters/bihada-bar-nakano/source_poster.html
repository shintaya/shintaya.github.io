<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<link rel="stylesheet" href="local.css">
<style>
:root{
  --bg:#191722; --bg2:#262131; --gold:#d8b57e; --gold2:#b8925a; --blush:#ecc5b6;
  --cream:#f6eee4; --muted:#cfc3b6; --line:rgba(216,181,126,.45);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:var(--bg)}
body{font-family:'Zen Kaku Gothic New',sans-serif;color:var(--cream);}
.poster{position:relative;overflow:hidden;
  background:
    radial-gradient(ellipse at 85% 20%, rgba(236,197,182,.16), transparent 55%),
    radial-gradient(ellipse at 10% 95%, rgba(216,181,126,.14), transparent 50%),
    linear-gradient(160deg,var(--bg2),var(--bg) 60%);
}
.frame{position:absolute;inset:22px;border:2px solid var(--line);border-radius:18px;pointer-events:none}
.frame::after{content:"";position:absolute;inset:8px;border:1px solid rgba(216,181,126,.2);border-radius:12px}
.serif{font-family:'Shippori Mincho B1',serif}
.en{font-family:'Cormorant Garamond',serif;font-style:italic;letter-spacing:.08em}

.cta{background:linear-gradient(135deg,#e6c792,var(--gold) 45%,var(--gold2));color:#221a14;
  border-radius:16px;font-weight:700;text-align:center;line-height:1.35;
  box-shadow:0 10px 30px rgba(0,0,0,.35)}
.cta b{color:#7a2f3a}
.eyebrow{color:var(--gold);font-weight:500;letter-spacing:.2em}
.title{font-weight:800;letter-spacing:.02em;line-height:1.15;color:var(--cream)}
.title .bar{color:var(--gold)}
.sub{color:var(--blush);font-weight:500}
.card{border:1.5px solid var(--line);border-radius:14px;background:rgba(255,255,255,.035)}
.label{color:var(--gold);font-weight:700;letter-spacing:.08em}
.val{font-weight:700;line-height:1.3}
.note{color:var(--muted);font-weight:500}
.tag{color:var(--gold);font-weight:700;letter-spacing:.04em}
.dl b{color:var(--blush)}

/* ===== 16:9 ===== */
.w{width:1920px;height:1080px;padding:62px 74px}
.w .cta{padding:18px 30px;font-size:54px}
.w .cta.one{font-size:66px;padding:34px 30px}
.w .head{display:flex;align-items:flex-end;justify-content:space-between;margin-top:34px}
.w .eyebrow{font-size:30px}
.w .title{font-size:96px;margin-top:2px}
.w .sub{font-size:44px;margin-top:4px}
.w .illu{position:absolute;right:96px;top:300px;width:280px;height:215px}
.w .grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:18px;margin-top:26px}
.w .card{padding:18px 26px}
.w .label{font-size:30px}
.w .val{font-size:46px}
.w .val.mid{font-size:40px}
.w .val.big{font-size:66px}
.w .note{font-size:33px}
.w .foot{position:absolute;left:74px;right:74px;bottom:56px;display:flex;justify-content:space-between;align-items:baseline}
.w .dl{font-size:44px;font-weight:700}
.w .tag{font-size:44px}

/* ===== 1:1 ===== */
.s{width:1200px;height:1200px;padding:58px 62px}
.s .cta{padding:18px 24px;font-size:50px}
.s .cta.one{font-size:58px;padding:32px 26px}
.s .head{display:flex;align-items:flex-end;justify-content:space-between;margin-top:28px}
.s .eyebrow{font-size:28px}
.s .title{font-size:84px;margin-top:2px}
.s .sub{font-size:42px;margin-top:6px}
.s .illu{position:absolute;right:70px;top:300px;width:230px;height:176px}
.s .grid{display:grid;grid-template-columns:1fr;gap:12px;margin-top:20px}
.s .card{padding:14px 22px;display:flex;align-items:baseline;gap:18px}
.s .label{font-size:26px;flex:0 0 auto}
.s .val{font-size:42px}
.s .val.mid{font-size:35px}
.s .val.big{font-size:52px}
.s .note{font-size:31px}
.s .row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.s .row2 .card{display:block}
.s .foot{position:absolute;left:62px;right:62px;bottom:52px;display:flex;justify-content:space-between;align-items:baseline}
.s .dl{font-size:40px;font-weight:700}
.s .tag{font-size:40px}
</style></head>
<body>
<div id="root"></div>
<script>
const p=new URLSearchParams(location.search);
const shape=p.get('shape')||'w', media=p.get('media')||'x';
const cta = media==='x'
  ? `<div class="cta">この投稿に<b>いいね・リプ</b>をくれた方に、<br>DMで詳細と日程アンケートをお送りします</div>`
  : `<div class="cta one">アンケートはこのお知らせのリンクから</div>`;
const illu = `<svg class="illu" viewBox="0 0 300 230" fill="none" stroke="#d8b57e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
  <!-- coupe glass -->
  <path d="M40 70 Q95 135 150 70 Z" fill="rgba(236,197,182,.22)"/>
  <path d="M95 112 L95 190 M65 196 Q95 186 125 196"/>
  <circle cx="132" cy="62" r="9" fill="#c4566a" stroke="#c4566a"/>
  <path d="M132 53 Q138 36 152 30" stroke-width="3"/>
  <!-- dropper bottle -->
  <rect x="180" y="108" width="54" height="86" rx="12" fill="rgba(216,181,126,.12)"/>
  <rect x="192" y="86" width="30" height="22" rx="4"/>
  <path d="M199 86 Q199 62 207 62 Q215 62 215 86"/>
  <path d="M192 140 H222" stroke-width="3" opacity=".6"/>
  <!-- small jar -->
  <rect x="246" y="152" width="44" height="42" rx="8" fill="rgba(236,197,182,.18)"/>
  <rect x="242" y="140" width="52" height="14" rx="5"/>
  <!-- sparkles -->
  <path d="M60 22 v24 M48 34 h24" stroke-width="3"/>
  <path d="M262 70 v18 M253 79 h18" stroke-width="3"/>
  <path d="M20 160 v14 M13 167 h14" stroke-width="2.5"/>
  <path d="M30 202 H290" stroke-width="2" opacity=".5"/>
</svg>`;
const title = shape==='w'
  ? `美肌部<span class="bar">BAR</span>｜中野インスタンス`
  : `美肌部<span class="bar">BAR</span>｜<br>中野インスタンス`;
const head = `<div class="head"><div>
    <div class="eyebrow en">VRC Bihada-bu &nbsp;·&nbsp; Real Meetup</div>
    <div class="title serif">${title}</div>
    <div class="sub">中野のバー貸切 リアル交流会</div>
  </div>${illu}</div>`;
const date = `<div class="card" style="${shape==='w'?'grid-column:1 / span 2':''}"><div class="label">候補日</div><div class="val big serif">11/23<span style="font-size:.6em">（月・祝）</span>／11/29<span style="font-size:.6em">（日）</span></div></div>`;
const fee = `<div class="card"><div class="label">参加費（各部・チャージ込み）</div><div class="val">2杯付き <span class="serif" style="font-size:1.25em;color:var(--blush)">3,000</span>円～</div></div>`;
const time = `<div class="card"><div class="label">時間・人数</div><div class="val">各部2時間・13〜15名予定</div><div class="note">定員を超えた場合は抽選</div></div>`;
const cos = `<div class="card"><div class="label">当日のおたのしみ</div><div class="val mid">コスメやサンプルのお試し／<br>美肌部グッズの展示・販売</div></div>`;
const solo = shape==='w'
  ? `<div class="card"><div class="label">お申し込み</div><div class="note" style="color:var(--cream);line-height:1.45">お友だちと参加する場合も、<br>おひとりずつお申し込みください</div></div>`
  : `<div class="card"><div class="note" style="color:var(--cream)">お友だちと参加する場合も、おひとりずつお申し込みください</div></div>`;
const foot = `<div class="foot"><div class="dl">アンケートしめきり <b>10/30（金）23:59</b></div><div class="tag">#VRC美肌部</div></div>`;
let body;
if(shape==='w'){
  body = `${cta}${head}<div class="grid">${date}${fee}${time}${cos}${solo}</div>${foot}`;
}else{
  body = `${cta}${head}<div class="grid">${date}${fee}<div class="row2">${time}${cos}</div>${solo}</div>${foot}`;
}
document.getElementById('root').innerHTML = `<div class="poster ${shape}"><div class="frame"></div>${body}</div>`;
</script>
</body></html>
